<!DOCTYPE html>
<html>
<head>
  <title>Shreyasuuuuuuuuuuuu 💗</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      margin-top: 100px;
      background-color: #ffe6f0;
      transition: 0.5s;
    }

    h1 {
      font-size: 40px;
    }

    h2 {
      margin-bottom: 30px;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      margin: 10px;
    }

    #yes {
      background-color: #ff4da6;
      color: white;
    }

    #no {
      background-color: grey;
      color: white;
      position: absolute;
    }

    .small-text {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Shreyasuuuuuuuuuuu 🥺💗</h1>
  <h2>Will you meet me this month?</h2>

  <p class="small-text">
    Side effects may include intense eye contact, unexpected hugs, and mild nervousness.
  </p>

  <button id="yes" onclick="sayYes()">YES 💞</button>
  <button id="no" onmouseover="moveButton()">NO</button>

  <script>
    function sayYes() {
      document.body.innerHTML = `
        <h1>Meeting Confirmed 💫</h1>

        <p>First real eye contact: Loading… 👀</p>
        <p>Hug probability: High 🤗</p>
        <p>Kiss probability: Classified 😌</p>

        <p>Nervous level: 82% (normal for first meetings)</p>
        <p>Excitement level: 100% 🔥</p>

        <p style="margin-top:30px;">
        Relax… I promise I’m not scary.  
        Just slightly adorable and mildly dangerous 🙈
        </p>
      `;
    }

    function moveButton() {
      var button = document.getElementById("no");
      button.style.top = Math.random() * 400 + "px";
      button.style.left = Math.random() * 400 + "px";
    }
  </script>

</body>
</html>
