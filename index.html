<!DOCTYPE html>
<html>
<head>
  <title>shreyasuuuu 💗</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #ffe6f0;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .small-text {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 30px;
      max-width: 300px;
    }

    button {
      padding: 18px 40px;
      font-size: 18px;
      border-radius: 15px;
      border: none;
      cursor: pointer;
      margin: 10px;
      min-width: 140px;
    }

    #yes {
      background-color: #ff4da6;
      color: white;
    }

    #no {
      background-color: grey;
      color: white;
      position: absolute;
    }
  </style>
</head>

<body>

  <h1>Shreyasuuuu 🥺💗</h1>
  <h2>Will you meet me this month?</h2>

  <p class="small-text">
    Side effects may include intense eye contact, unexpected hugs, and mild nervousness.
  </p>

  <button id="yes" onclick="sayYes()">YES 💞</button>
  <button id="no" onmouseover="moveButton()">NO</button>

  <script>
    function sayYes() {
      document.body.innerHTML = `
        <h1>Meeting Confirmed 💫</h1>

        <p>First real eye contact: Loading… 👀</p>
        <p>Hug probability: High 🤗</p>
        <p>Kiss probability: Classified 😌</p>

        <p>Nervous level: 82%</p>
        <p>Excitement level: 100% 🔥</p>

        <p style="margin-top:30px;">
        Don’t worry… I promise I won’t bite you.
        </p>
        <p>
        And definitely no bite marks. Probably. 🙈
        </p>
      `;
    }

    function moveButton() {
      var button = document.getElementById("no");
      button.style.top = Math.random() * window.innerHeight + "px";
      button.style.left = Math.random() * window.innerWidth + "px";
    }
  </script>

</body>
</html>
